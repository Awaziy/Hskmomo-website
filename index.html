<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momo · บัญชีผู้ใช้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --red: #D9534F; --red-d: #C2413D; --red-soft: #FCEBEA;
    --bg: #F4F5F8; --card: #FFFFFF; --ink: #1E2330; --sub: #5D6474; --muted: #8E95A4; --line: #E6E8EE;
    --green: #2E8B57; --green-soft: #E5F4EA; --blue-soft: #E8EFFD;
    --shadow: 0 1px 2px rgba(30,35,48,.05), 0 12px 32px rgba(30,35,48,.08);
    --font: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 15px/1.55 var(--font); color: var(--ink); background: var(--bg);
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto 0; height: 46svh; z-index: -1;
    background: linear-gradient(160deg, var(--red) 0%, var(--red-d) 100%);
    border-radius: 0 0 36px 36px;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--red) 45%, transparent); outline-offset: 2px; }

  .wrap { width: 100%; max-width: 420px; }
  .brand { text-align: center; color: #fff; margin-bottom: 18px; }
  .logo { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 18px; background: #fff; color: var(--red);
    display: grid; place-items: center; font-size: 34px; font-weight: 800; box-shadow: 0 8px 20px rgba(0,0,0,.12); }
  .brand h1 { margin: 0; font-size: 24px; letter-spacing: .2px; }
  .brand p { margin: 2px 0 0; opacity: .9; font-size: 14px; }

  .card { background: var(--card); border-radius: 24px; padding: 22px 20px 24px; box-shadow: var(--shadow); }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 14px; padding: 4px; margin-bottom: 18px; }
  .tabs button { border: 0; background: none; padding: 10px; border-radius: 11px; font-weight: 700; color: var(--sub); cursor: pointer; transition: background .15s, color .15s; }
  .tabs button[aria-selected="true"] { background: var(--red); color: #fff; box-shadow: 0 2px 6px rgba(217,83,79,.3); }

  form { display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 700; }
  .field { position: relative; }
  input[type=email], input[type=password], input[type=text] {
    width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff;
    font-size: 16px; /* 16px stops iOS zooming into the field */ transition: border-color .15s, box-shadow .15s;
  }
  input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; padding: 8px;
    color: var(--muted); cursor: pointer; border-radius: 10px; font-size: 12.5px; font-weight: 700; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 500; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; width: 100%;
    border: 0; border-radius: 14px; font-weight: 800; font-size: 16px; cursor: pointer; transition: background .15s, transform .05s; }
  .btn:active { transform: scale(.99); }
  .btn.primary { background: var(--red); color: #fff; margin-top: 4px; }
  .btn.primary:hover { background: var(--red-d); }
  .btn.ghost { background: var(--bg); color: var(--ink); }
  .btn.ghost:hover { background: var(--line); }
  .btn:disabled { opacity: .65; cursor: progress; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.45); border-top-color: #fff; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }

  .msg { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; }
  .msg.err { background: var(--red-soft); color: var(--red-d); }
  .msg.ok { background: var(--green-soft); color: var(--green); }

  /* profile */
  .profile { text-align: center; margin-top: 48px; }
  .avatar { width: 88px; height: 88px; margin: -66px auto 10px; border-radius: 50%; background: var(--red); color: #fff;
    display: grid; place-items: center; font-size: 38px; font-weight: 800; border: 5px solid #fff; box-shadow: 0 6px 16px rgba(30,35,48,.15); }
  .profile h2 { margin: 0; font-size: 22px; overflow-wrap: anywhere; }
  .profile .email { margin: 2px 0 14px; color: var(--sub); overflow-wrap: anywhere; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: var(--green-soft); color: var(--green); font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
  .rows { margin: 18px 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-align: left; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; font-size: 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row span { color: var(--muted); flex: none; }
  .row b { font-weight: 600; text-align: right; overflow-wrap: anywhere; }

  .loading { text-align: center; color: var(--sub); padding: 30px 0; }
  .loading .spin { margin: 0 auto 10px; border-color: var(--line); border-top-color: var(--red); width: 28px; height: 28px; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 2s !important; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <div class="logo">汉</div>
    <h1>HSK Momo</h1>
    <p>ฝึกภาษาจีน สอบ HSK ได้ทุกที่</p>
  </header>

  <!-- loading while the saved session is checked -->
  <section class="card loading" id="loadingView"><div class="spin"></div>กำลังโหลด…</section>

  <!-- sign in / sign up -->
  <section class="card" id="authView" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabLogin" aria-selected="true">เข้าสู่ระบบ</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false">สมัครสมาชิก</button>
    </div>

    <form id="authForm" novalidate>
      <label id="nickWrap" hidden>ชื่อเล่น
        <input type="text" id="nickname" placeholder="เช่น สมชาย" maxlength="40" autocomplete="nickname">
      </label>
      <label>อีเมล
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email" inputmode="email" required>
      </label>
      <label>รหัสผ่าน
        <div class="field">
          <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="current-password" required minlength="6">
          <button type="button" class="eye" id="eye" aria-label="แสดงรหัสผ่าน">แสดง</button>
        </div>
        <span class="hint" id="pwHint" hidden>รหัสผ่านอย่างน้อย 6 ตัวอักษร</span>
      </label>
      <div class="msg" id="msg" role="status" hidden></div>
      <button class="btn primary" type="submit" id="submitBtn">เข้าสู่ระบบ</button>
    </form>
  </section>

  <!-- profile -->
  <section class="card profile" id="profileView" hidden>
    <div class="avatar" id="avatar">?</div>
    <h2 id="pNick">—</h2>
    <p class="email" id="pEmail">—</p>
    <span class="badge">● เข้าสู่ระบบแล้ว</span>
    <div class="rows">
      <div class="row"><span>ชื่อเล่น</span><b id="rNick">—</b></div>
      <div class="row"><span>อีเมล</span><b id="rEmail">—</b></div>
      <div class="row"><span>สมัครเมื่อ</span><b id="rCreated">—</b></div>
      <div class="row"><span>เข้าใช้ล่าสุด</span><b id="rLast">—</b></div>
    </div>
    <button class="btn ghost" id="logoutBtn" type="button">ออกจากระบบ</button>
  </section>

  <p class="foot">เชื่อมต่อกับ Supabase</p>
</main>

<script>
/* ---------- Supabase connection ---------- */
// The client needs the project's base URL (without /rest/v1/).
const SUPABASE_URL = 'https://eoinanjbufbcbcdvntvz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dTtcjGnI958kv3FwapVujw_osfLrJNK';

const $ = (id) => document.getElementById(id);
const views = { loading: $('loadingView'), auth: $('authView'), profile: $('profileView') };
let mode = 'login';      // 'login' | 'signup'
let sb = null;

function show(name) { for (const k in views) views[k].hidden = k !== name; }
function message(text, type = 'err') { const m = $('msg'); m.textContent = text; m.className = 'msg ' + type; m.hidden = !text; }
function busy(on) {
  const b = $('submitBtn'); b.disabled = on;
  b.innerHTML = on ? '<span class="spin"></span> กรุณารอสักครู่…' : (mode === 'login' ? 'เข้าสู่ระบบ' : 'สร้างบัญชี');
}

function setMode(m) {
  mode = m;
  $('tabLogin').setAttribute('aria-selected', m === 'login');
  $('tabSignup').setAttribute('aria-selected', m === 'signup');
  $('nickWrap').hidden = m !== 'signup';
  $('pwHint').hidden = m !== 'signup';
  $('password').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
  message('');
  busy(false);
}

// Turn Supabase's English errors into clear Thai messages.
function thaiError(err) {
  const s = (err && (err.message || err.error_description || String(err))) || '';
  if (/invalid login credentials/i.test(s)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
  if (/email not confirmed/i.test(s)) return 'ยังไม่ได้ยืนยันอีเมล กรุณากดลิงก์ยืนยันในกล่องจดหมายก่อน';
  if (/already registered|already exists/i.test(s)) return 'อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบแทน';
  if (/password should be at least|weak/i.test(s)) return 'รหัสผ่านสั้นหรือง่ายเกินไป (อย่างน้อย 6 ตัวอักษร)';
  if (/rate limit|too many/i.test(s)) return 'ส่งคำขอบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่';
  if (/invalid.*email|unable to validate email/i.test(s)) return 'รูปแบบอีเมลไม่ถูกต้อง';
  if (/signups not allowed|signup.*disabled/i.test(s)) return 'ระบบปิดการสมัครสมาชิกอยู่ (เปิดได้ใน Supabase > Authentication)';
  if (/failed to fetch|network/i.test(s)) return 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต';
  return 'เกิดข้อผิดพลาด: ' + s;
}

const fmtDate = (d) => d ? new Date(d).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' }) : '—';

function renderProfile(user) {
  const nick = (user.user_metadata && user.user_metadata.nickname) || user.email.split('@')[0];
  $('avatar').textContent = nick.trim().charAt(0).toUpperCase() || '?';
  $('pNick').textContent = nick;
  $('pEmail').textContent = user.email;
  $('rNick').textContent = nick;
  $('rEmail').textContent = user.email;
  $('rCreated').textContent = fmtDate(user.created_at);
  $('rLast').textContent = fmtDate(user.last_sign_in_at);
  show('profile');
}

/* ---------- events ---------- */
$('tabLogin').onclick = () => setMode('login');
$('tabSignup').onclick = () => setMode('signup');
$('eye').onclick = () => {
  const p = $('password'); const hidden = p.type === 'password';
  p.type = hidden ? 'text' : 'password'; $('eye').textContent = hidden ? 'ซ่อน' : 'แสดง';
};

$('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  const nickname = $('nickname').value.trim();

  if (mode === 'signup' && !nickname) return message('กรุณากรอกชื่อเล่น');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return message('กรุณากรอกอีเมลให้ถูกต้อง');
  if (password.length < 6) return message('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
  if (!sb) return message('โหลดระบบ Supabase ไม่สำเร็จ กรุณารีเฟรชหน้า');

  message(''); busy(true);
  try {
    if (mode === 'signup') {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { nickname }, emailRedirectTo: location.href.split('#')[0] },
      });
      if (error) throw error;
      // Supabase returns a user with no identities when the email is already registered.
      if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('already registered');
      if (data.session) { renderProfile(data.user); }
      else {
        setMode('login'); $('email').value = email; $('password').value = '';
        message('สมัครสำเร็จ! กรุณาเปิดอีเมลแล้วกดลิงก์ยืนยัน จากนั้นกลับมาเข้าสู่ระบบ', 'ok');
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      $('password').value = '';
      renderProfile(data.user);
    }
  } catch (err) {
    message(thaiError(err));
  } finally {
    busy(false);
  }
});

$('logoutBtn').onclick = async () => {
  const b = $('logoutBtn'); b.disabled = true; b.textContent = 'กำลังออกจากระบบ…';
  try { await sb.auth.signOut(); } catch (e) { console.warn(e); }
  b.disabled = false; b.textContent = 'ออกจากระบบ';
  setMode('login'); show('auth');
};

/* ---------- start ---------- */
(async function init() {
  setMode('login');
  if (!window.supabase || !window.supabase.createClient) {
    show('auth'); return message('โหลดไลบรารี Supabase ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช');
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });

  // Keep the screen in step with the session (also covers the email-confirmation link and other tabs).
  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user) renderProfile(session.user);
    else if (event === 'SIGNED_OUT') { setMode('login'); show('auth'); }
  });

  const { data } = await sb.auth.getSession();
  if (data.session && data.session.user) renderProfile(data.session.user);
  else show('auth');
})();
</script>
</body>
</html>
